name: Feature
description: Something new the site should do, or a better way to do something it already does.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or awkward, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd build, in a few sentences or bullets.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Tradeoffs, open questions, and links.
