name: Bug
description: Something on the site doesn't work the way it should.
type: Bug
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you did, and what went wrong.
    validations:
      required: true
  - type: textarea
    id: what-should-happen
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: The cause or a fix, if you know it.
