name: Task
description: Work that isn't a user-facing feature, such as CI, tooling, or an upstream contribution.
type: Task
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or awkward, and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd do, in a few sentences or bullets.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Tradeoffs, open questions, and links.
