name: Preview branch cleanup

# pull_request_target runs this file as main has it, so a branch cannot change what runs with
# NEON_API_KEY or an OIDC token. Nothing here checks out or runs the pull request's code, and pull
# request data reaches a shell only through the environment. Both jobs skip pull requests from forks,
# whose branches can share a name with one of this repository's.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  # The Neon integration deletes a preview branch only after its last deployment is deleted, so closed
  # pull requests would otherwise keep branches that Neon's Launch plan bills past the tenth.
  delete-neon-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the preview's Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH: preview/${{ github.event.pull_request.head.ref }}
        run: npx --yes neonctl@2.47.0 branches delete "$BRANCH" --project-id "$PROJECT_ID"

  # Blob has no branches, so the preview deletes its own image folders, trash included, with its own
  # credentials. Every deployment of a branch shares its folders, so any successful one can.
  delete-preview-images:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      pull-requests: read
      id-token: write
    steps:
      # Vercel records each preview as a GitHub deployment to the Preview environment, with its URL on
      # a success status. A later deployment marks earlier ones inactive, so any success counts.
      - name: Find the pull request's previews
        id: previews
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The head commit, then the pull request's earlier commits, newest first.
          shas=$({
            echo "$HEAD_SHA"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/commits" --jq '.[].sha' | tac
          } | awk '!seen[$0]++')
          urls=''
          for sha in $shas; do
            for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$sha&environment=Preview" --jq '.[].id'); do
              url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
                --jq 'map(select(.state == "success"))[0].environment_url // empty')
              urls="$urls${url:+ $url}"
            done
          done
          if [ -z "$urls" ]; then
            echo "::notice::No successful preview of this pull request, so no images to delete"
          fi
          echo "urls=${urls# }" >> "$GITHUB_OUTPUT"

      # Vercel's Trusted Sources let this job's GitHub Actions token past Vercel Authentication on
      # previews. Vercel does not say whether that header reaches the function, and the route must tell
      # this job from anyone else Vercel admits, so the same token goes again as a bearer token, which
      # the route verifies. A commit deployed on another branch answers 409, so the next is tried.
      - name: Delete the preview's images
        if: steps.previews.outputs.urls != ''
        env:
          AUDIENCE: https://github.com/${{ github.repository_owner }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PREVIEW_URLS: ${{ steps.previews.outputs.urls }}
        run: |
          set -euo pipefail
          audience=$(jq -rn --arg value "$AUDIENCE" '$value | @uri')
          branch=$(jq -rn --arg value "$BRANCH" '$value | @uri')
          token=$(curl -sSf -H @- "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" \
            <<< "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          echo "::add-mask::$token"
          # printf is a shell builtin, so the token never reaches a command line; curl reads the
          # headers from stdin, one per line.
          printf -v headers 'x-vercel-trusted-oidc-idp-token: %s\nAuthorization: Bearer %s' \
            "$token" "$token"
          response="$RUNNER_TEMP/preview-images.json"
          for url in $PREVIEW_URLS; do
            status=$(curl -sS -o "$response" -w '%{http_code}' --data '' -H @- \
              "$url/api/preview-images?branch=$branch" <<< "$headers")
            case "$status" in
              2??)
                echo "Deleted the preview's images through $url: $(cat "$response")"
                exit 0
                ;;
              409)
                echo "$url deploys another branch"
                ;;
              *)
                echo "::error::$url answered $status"
                exit 1
                ;;
            esac
          done
          echo "::notice::No preview of this branch was found, so no images to delete"
