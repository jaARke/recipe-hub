name: Preview branch cleanup

# The Neon integration deletes a preview branch only after its last deployment is deleted, so closed
# pull requests would otherwise hold branches against the Free plan's cap of 10.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-neon-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
