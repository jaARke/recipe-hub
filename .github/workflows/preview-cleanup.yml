name: Preview cleanup

# pull_request_target, delete, and schedule run this file as main has it, so a branch cannot change
# what runs with VERCEL_TOKEN or PREVIEW_BLOB_TOKEN. Nothing here checks out code, and a branch name
# reaches a shell only through the environment.
on:
  pull_request_target:
    types: [closed]
  delete:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

# A merge may fire both closed and delete for one branch, so a branch's runs go one at a time, each
# with both its jobs.
concurrency:
  group: preview-cleanup-${{ (github.event_name == 'pull_request_target' && format('branch-{0}', github.event.pull_request.head.ref)) || (github.event_name == 'delete' && format('branch-{0}', github.event.ref)) || 'sweep' }}

env:
  # The sweep's idle limit, matching the project's preview retention in Vercel.
  PREVIEW_IDLE_DAYS: 7
  VERCEL_PROJECT_ID: prj_GeBPGpiAp3MaFqhzfcqOvvd152CX
  # The closed pull request's or the deleted branch's name; empty for the sweep.
  BRANCH: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.ref) || (github.event_name == 'delete' && github.event.ref) || '' }}

# A branch's previews and its image folders in the preview Blob store leave together, each job with
# the one secret it needs, so the Blob SDK's packages from npm never run on a machine holding
# VERCEL_TOKEN.
jobs:
  # The Neon integration deletes a preview's Neon branch only with the branch's last preview, and
  # Vercel keeps an open branch's newest preview and the project's newest previews past retention.
  delete-previews:
    # Skips a fork's pull request, whose branch can share a name with one of this repository's, and a
    # deleted tag.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event.ref_type == 'branch' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # Each branch this run decided on, as JSON: [{branch, clears}].
      decisions: ${{ steps.previews.outputs.decisions }}
      # When the previews were listed, in milliseconds since the epoch.
      listed-at: ${{ steps.previews.outputs.listed-at }}
    steps:
      - name: Delete previews
        id: previews
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Set the repository secret VERCEL_TOKEN to a token scoped to the Vercel project"
            exit 1
          fi
          response="$RUNNER_TEMP/vercel-response.json"
          # curl reads the header from stdin, so the token never reaches a command line.
          vercel_api() {
            : > "$response"
            curl -sS --retry 3 -o "$response" -w '%{http_code}' -X "$1" -H @- \
              "https://api.vercel.com$2" <<< "Authorization: Bearer $VERCEL_TOKEN"
          }

          listed_at=$(jq -n 'now * 1000 | floor')
          # Pages run newest first, and each page's pagination.next is the next page's until.
          previews="$RUNNER_TEMP/previews.jsonl"
          : > "$previews"
          query="projectId=$VERCEL_PROJECT_ID&target=preview&limit=100"
          if [ -n "$BRANCH" ]; then
            query="$query&branch=$(jq -rn '$ENV.BRANCH | @uri')"
          fi
          next=''
          while :; do
            status=$(vercel_api GET "/v7/deployments?$query${next:+&until=$next}")
            if [ "$status" != 200 ]; then
              echo "::error::Listing previews answered $status: $(cat "$response")"
              exit 1
            fi
            jq -c '.deployments[] | {uid, created, branch: .meta.githubCommitRef}' "$response" >> "$previews"
            next=$(jq -r '.pagination.next // empty' "$response")
            [ -n "$next" ] || break
          done

          branches="$RUNNER_TEMP/branches.json"
          if [ -n "$BRANCH" ]; then
            echo '[]' > "$branches"
          else
            gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' |
              jq -Rn '[inputs]' > "$branches"
          fi

          # One per branch: whether this run clears it, what it logs, and the previews it deletes.
          # Vercel does not document whether its branch filter matches exactly, so the select does.
          decisions=$(jq -cs --slurpfile branches "$branches" '
            ($ENV.PREVIEW_IDLE_DAYS | tonumber) as $idle_days
            | map(select($ENV.BRANCH == "" or .branch == $ENV.BRANCH))
            | group_by(.branch)
            | .[]
            | .[0].branch as $branch
            | ((now * 1000 - (map(.created) | max)) / 86400000) as $age
            | (if $ENV.GITHUB_EVENT_NAME == "pull_request_target" then "pull request closed"
              elif $ENV.GITHUB_EVENT_NAME == "delete" then "branch deleted"
              elif $branch != null and (any($branches[0][]; . == $branch) | not) then "gone from GitHub"
              elif $age > $idle_days then "idle over \($idle_days) days"
              else null end) as $reason
            | ("\($branch // "(no branch)"): \(length) preview\(if length > 1 then "s" else "" end),"
              + " the newest \(($age * 10 | floor) / 10) days old") as $summary
            | {$branch, clears: ($reason != null)}
              + if $reason then {message: "Clearing \($summary) (\($reason))", uids: map(.uid)}
                else {message: "Keeping \($summary)", uids: []} end' "$previews")

          # Set before any delete, so the images job runs even when one fails. An event decides on
          # its branch even when it has no preview.
          if [ -n "$BRANCH" ]; then
            echo "decisions=$(jq -cn '[{branch: $ENV.BRANCH, clears: true}]')" >> "$GITHUB_OUTPUT"
          else
            echo "decisions=$(jq -cs 'map(select(.branch != null) | {branch, clears})' <<< "$decisions")" >> "$GITHUB_OUTPUT"
          fi
          echo "listed-at=$listed_at" >> "$GITHUB_OUTPUT"

          plan=$(jq -r '[.message, (.uids | join(" "))] | @tsv' <<< "$decisions")
          if [ -z "$plan" ]; then
            echo "No previews${BRANCH:+ of $BRANCH}"
            exit 0
          fi
          failed=0
          while IFS=$'\t' read -r message uids; do
            echo "$message"
            for uid in $uids; do
              status=$(vercel_api DELETE "/v13/deployments/$uid") || true
              # 404: another run, or Vercel's retention, deleted it first.
              if [ "$status" != 200 ] && [ "$status" != 404 ]; then
                echo "::error::Deleting $uid answered $status: $(cat "$response")"
                failed=1
              fi
            done
          done <<< "$plan"
          exit "$failed"

  # Runs once the previews job has decided, even when one of its deletes failed, so a cleared
  # branch's folders still go. The previews go first, so none is left to write into its folders.
  delete-images:
    needs: delete-previews
    if: ${{ !cancelled() && needs.delete-previews.outputs.decisions != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      # The version pnpm-lock.yaml resolves for the app, installed with no secret in reach and none
      # of the packages' install scripts run.
      - name: Install the Blob SDK
        run: npm install --prefix "$RUNNER_TEMP/blob" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @vercel/blob@2.8.1
      - name: Delete image folders
        env:
          # The read-write token of the preview store, recipe-hub-images-preview.
          PREVIEW_BLOB_TOKEN: ${{ secrets.PREVIEW_BLOB_TOKEN }}
          DECISIONS: ${{ needs.delete-previews.outputs.decisions }}
          LISTED_AT: ${{ needs.delete-previews.outputs.listed-at }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_BLOB_TOKEN" ]; then
            echo "::error::Set the repository secret PREVIEW_BLOB_TOKEN to the read-write token of the Blob store recipe-hub-images-preview"
            exit 1
          fi

          # Lists the preview store's folders, or for one folder prints when its newest image was
          # uploaded, or deletes its images and prints how many. The script reads the token from the
          # environment, so it never reaches a command line.
          blob_client="$RUNNER_TEMP/blob/preview-folders.mjs"
          cat > "$blob_client" <<'JS'
          import { del, list } from '@vercel/blob';

          // A preview's images sit in a folder under each of these, named for its branch, as
          // ImageFolders and BlobImageStore's trash lay them out.
          const previewPrefixes = [
            'dish/preview/',
            'scan/preview/',
            'trash/dish/preview/',
            'trash/scan/preview/',
          ];
          // Vercel's example of deleting a store's blobs deletes 100 a request.
          const deleteBatchSize = 100;
          // Passed on every call, so no other credential the SDK could find takes its place.
          const token = process.env.PREVIEW_BLOB_TOKEN;

          async function listAll(options) {
            const blobs = [];
            const folders = [];
            let cursor;
            do {
              const page = await list({ ...options, cursor, token });
              blobs.push(...page.blobs);
              folders.push(...(page.folders ?? []));
              cursor = page.hasMore ? page.cursor : undefined;
            } while (cursor !== undefined);
            return { blobs, folders };
          }

          // One folder directly under a preview prefix, so nothing else in the store, such as the
          // seed's photos, is ever read or deleted.
          function isPreviewFolder(folder) {
            return previewPrefixes.some(
              (prefix) => folder.startsWith(prefix) && /^[^/]+\/$/.test(folder.slice(prefix.length))
            );
          }

          const [command, folder = ''] = process.argv.slice(2);
          try {
            if (command === 'list') {
              for (const prefix of previewPrefixes) {
                const { folders } = await listAll({ prefix, mode: 'folded' });
                folders.forEach((each) => console.log(each));
              }
            } else if (command === 'newest' && isPreviewFolder(folder)) {
              const { blobs } = await listAll({ prefix: folder });
              console.log(Math.max(0, ...blobs.map((blob) => blob.uploadedAt.getTime())));
            } else if (command === 'delete' && isPreviewFolder(folder)) {
              const { blobs } = await listAll({ prefix: folder });
              const pathnames = blobs.map((blob) => blob.pathname);
              for (let start = 0; start < pathnames.length; start += deleteBatchSize) {
                await del(pathnames.slice(start, start + deleteBatchSize), { token });
              }
              console.log(pathnames.length);
            } else {
              throw new Error(`Neither a listing nor a preview folder: ${command} ${folder}`);
            }
          } catch (error) {
            console.error(String(error));
            process.exitCode = 1;
          }
          JS
          blob_error="$RUNNER_TEMP/blob-error.txt"
          preview_folders() {
            node "$blob_client" "$@" 2> "$blob_error"
          }

          if ! folders=$(preview_folders list); then
            echo "::error::Listing the preview store's folders failed: $(cat "$blob_error")"
            exit 1
          fi

          # A branch's folder name ends with the first 8 hex digits of the SHA-256 of the branch
          # name's UTF-8 bytes, alone or after a hyphen: branchFolder in src/lib/env.ts is the other
          # copy of this rule. Only the hash is matched, never the readable part before it.
          branch_hash() {
            printf '%s' "$1" | sha256sum | cut -c1-8
          }
          # Each branch the previews job decided on, as its hash, whether it is cleared, and its
          # name, tab-separated.
          decided=''
          decided_branches=$(jq -r '.[] | [.branch, .clears] | @tsv' <<< "$DECISIONS")
          while IFS=$'\t' read -r branch clears; do
            if [ -n "$branch" ]; then
              decided+="$(branch_hash "$branch")"$'\t'"$clears"$'\t'"$branch"$'\n'
            fi
          done <<< "$decided_branches"

          # A folder of no listed preview's branch is kept while it holds an image uploaded since
          # the previews were listed, which a new branch's first preview may have written. Blob
          # stamps uploads by its own clock, so the grace covers a clock that differs from the
          # runner's.
          upload_grace_ms=$((5 * 60 * 1000))
          new_since=$((LISTED_AT - upload_grace_ms))

          failed=0
          cleared_any=0
          while IFS= read -r folder; do
            [ -n "$folder" ] || continue
            name=${folder%/}
            name=${name##*/}
            hash=${name##*-}
            entry=$(awk -F '\t' -v hash="$hash" '$1 == hash { print $2 "\t" $3; exit }' <<< "$decided")
            if [ -n "$entry" ]; then
              IFS=$'\t' read -r clears branch <<< "$entry"
              if [ "$clears" != true ]; then
                echo "Keeping $folder ($branch has a preview)"
                continue
              fi
              reason="branch $branch cleared"
            elif [ -n "$BRANCH" ]; then
              # An event clears only its own branch's folders.
              continue
            else
              if ! newest=$(preview_folders newest "$folder"); then
                echo "::error::Reading $folder failed: $(cat "$blob_error")"
                failed=1
                continue
              fi
              if [ "$newest" -ge "$new_since" ]; then
                echo "Keeping $folder (written to since the previews were listed)"
                continue
              fi
              reason='no preview'
            fi
            cleared_any=1
            if count=$(preview_folders delete "$folder"); then
              echo "Clearing $folder: $count image$([ "$count" = 1 ] || echo s) ($reason)"
            else
              echo "::error::Deleting the images in $folder failed: $(cat "$blob_error")"
              failed=1
            fi
          done <<< "$folders"
          if [ -n "$BRANCH" ] && [ "$cleared_any" = 0 ]; then
            echo "No image folders of $BRANCH"
          fi
          exit "$failed"
