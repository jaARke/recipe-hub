name: Preview cleanup

# pull_request_target, delete, and schedule run this file as main has it, so a branch cannot change
# what runs with VERCEL_TOKEN or PREVIEW_BLOB_TOKEN. Only the images job checks out code, the
# default branch's on those events, and a branch name reaches a shell only through the environment.
on:
  pull_request_target:
    types: [closed]
  delete:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

# A merge may fire both closed and delete for one branch, so a branch's runs go one at a time, each
# with both its jobs.
concurrency:
  group: preview-cleanup-${{ (github.event_name == 'pull_request_target' && format('branch-{0}', github.event.pull_request.head.ref)) || (github.event_name == 'delete' && format('branch-{0}', github.event.ref)) || 'sweep' }}

env:
  # The sweep's idle limit, matching the project's preview retention in Vercel.
  PREVIEW_IDLE_DAYS: 7
  VERCEL_PROJECT_ID: prj_GeBPGpiAp3MaFqhzfcqOvvd152CX
  # The closed pull request's or the deleted branch's name; empty for the sweep.
  BRANCH: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.ref) || (github.event_name == 'delete' && github.event.ref) || '' }}

# A branch's previews and its image folders in the preview Blob store leave together, each job with
# the one secret it needs, so the packages the images job installs never run on a machine holding
# VERCEL_TOKEN.
jobs:
  # The Neon integration deletes a preview's Neon branch only with the branch's last preview, and
  # Vercel keeps an open branch's newest preview and the project's newest previews past retention.
  delete-previews:
    # Skips a fork's pull request, whose branch can share a name with one of this repository's, and a
    # deleted tag.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event.ref_type == 'branch' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # Each branch this run decided on and what became of its previews, as JSON:
      # [{branch, previews}], previews being kept, deleted, or delete-failed.
      preview-outcomes: ${{ steps.previews.outputs.preview-outcomes }}
      # When the previews were listed, in milliseconds since the epoch.
      listed-at: ${{ steps.previews.outputs.listed-at }}
    steps:
      - name: Delete previews
        id: previews
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Set the repository secret VERCEL_TOKEN to a token scoped to the Vercel project"
            exit 1
          fi
          response="$RUNNER_TEMP/vercel-response.json"
          # curl reads the header from stdin, so the token never reaches a command line.
          vercel_api() {
            : > "$response"
            curl -sS --retry 3 -o "$response" -w '%{http_code}' -X "$1" -H @- \
              "https://api.vercel.com$2" <<< "Authorization: Bearer $VERCEL_TOKEN"
          }

          listed_at=$(jq -n 'now * 1000 | floor')
          # Pages run newest first, and each page's pagination.next is the next page's until.
          previews="$RUNNER_TEMP/previews.jsonl"
          : > "$previews"
          query="projectId=$VERCEL_PROJECT_ID&target=preview&limit=100"
          if [ -n "$BRANCH" ]; then
            query="$query&branch=$(jq -rn '$ENV.BRANCH | @uri')"
          fi
          next=''
          while :; do
            status=$(vercel_api GET "/v7/deployments?$query${next:+&until=$next}")
            if [ "$status" != 200 ]; then
              echo "::error::Listing previews answered $status: $(cat "$response")"
              exit 1
            fi
            jq -c '.deployments[] | {uid, created, branch: .meta.githubCommitRef}' "$response" >> "$previews"
            next=$(jq -r '.pagination.next // empty' "$response")
            [ -n "$next" ] || break
          done

          branches="$RUNNER_TEMP/branches.json"
          if [ -n "$BRANCH" ]; then
            echo '[]' > "$branches"
          else
            gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' |
              jq -Rn '[inputs]' > "$branches"
          fi

          # One per branch: whether this run clears it, what it logs, and the previews it deletes.
          # Vercel does not document whether its branch filter matches exactly, so the select does.
          decisions=$(jq -cs --slurpfile branches "$branches" '
            ($ENV.PREVIEW_IDLE_DAYS | tonumber) as $idle_days
            | map(select($ENV.BRANCH == "" or .branch == $ENV.BRANCH))
            | group_by(.branch)
            | .[]
            | .[0].branch as $branch
            | ((now * 1000 - (map(.created) | max)) / 86400000) as $age
            | (if $ENV.GITHUB_EVENT_NAME == "pull_request_target" then "pull request closed"
              elif $ENV.GITHUB_EVENT_NAME == "delete" then "branch deleted"
              elif $branch != null and (any($branches[0][]; . == $branch) | not) then "gone from GitHub"
              elif $age > $idle_days then "idle over \($idle_days) days"
              else null end) as $reason
            | ("\($branch // "(no branch)"): \(length) preview\(if length > 1 then "s" else "" end),"
              + " the newest \(($age * 10 | floor) / 10) days old") as $summary
            | {$branch, clears: ($reason != null)}
              + if $reason then {message: "Clearing \($summary) (\($reason))", uids: map(.uid)}
                else {message: "Keeping \($summary)", uids: []} end' "$previews")

          # One line per branch for the images job, which clears a branch's folders only when every
          # one of its previews is gone.
          outcomes="$RUNNER_TEMP/outcomes.jsonl"
          : > "$outcomes"
          if [ -z "$decisions" ]; then
            echo "No previews${BRANCH:+ of $BRANCH}"
          fi
          failed=0
          while IFS= read -r decision; do
            [ -n "$decision" ] || continue
            jq -r .message <<< "$decision"
            deleted=true
            for uid in $(jq -r '.uids[]' <<< "$decision"); do
              status=$(vercel_api DELETE "/v13/deployments/$uid") || true
              # 404: another run, or Vercel's retention, deleted it first.
              if [ "$status" != 200 ] && [ "$status" != 404 ]; then
                echo "::error::Deleting $uid answered $status: $(cat "$response")"
                deleted=false
                failed=1
              fi
            done
            jq -c --argjson deleted "$deleted" '{branch, previews: (if .clears | not then "kept"
              elif $deleted then "deleted" else "delete-failed" end)}' <<< "$decision" >> "$outcomes"
          done <<< "$decisions"
          # An event's branch with no preview has none left to delete.
          if [ -n "$BRANCH" ] && [ ! -s "$outcomes" ]; then
            jq -cn '{branch: $ENV.BRANCH, previews: "deleted"}' > "$outcomes"
          fi

          # Set even when a delete failed, so the images job still runs.
          echo "preview-outcomes=$(jq -cs 'map(select(.branch != null))' "$outcomes")" >> "$GITHUB_OUTPUT"
          echo "listed-at=$listed_at" >> "$GITHUB_OUTPUT"
          exit "$failed"

  # Runs once the previews job has decided, even when one of its deletes failed, after the previews,
  # so no preview is left to write into the folders it clears.
  delete-images:
    needs: delete-previews
    if: ${{ !cancelled() && needs.delete-previews.outputs.preview-outcomes != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The event's commit: the default branch's on pull_request_target, never the pull request's
      # head, and on delete and schedule; on workflow_dispatch, the chosen branch's, as for this
      # file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      # Every package as pnpm-lock.yaml pins it, integrity hash and all, with no secret in reach and
      # none of their install scripts run.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Delete image folders
        env:
          # The read-write token of the preview store, recipe-hub-images-preview.
          PREVIEW_BLOB_TOKEN: ${{ secrets.PREVIEW_BLOB_TOKEN }}
          PREVIEW_OUTCOMES: ${{ needs.delete-previews.outputs.preview-outcomes }}
          LISTED_AT: ${{ needs.delete-previews.outputs.listed-at }}
        run: pnpm exec tsx --tsconfig scripts/tsconfig.json scripts/preview-cleanup/preview-cleanup.ts
